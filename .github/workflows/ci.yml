name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: gofmt -w .
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -bench 'Benchmark(Set|Get|Reopen|Compact)$' -benchmem ./...
